<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Telegram Web App Test</title>
  <script async src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<h3>Send data to bot</h3>
<button id="send">Send Data</button>

<script>
  // Wait for Telegram object
  const tg = window.Telegram.WebApp;

  // Optional: expand viewport
  tg.expand();

  document.getElementById("send").addEventListener("click", () => {
    // Data you want to send
    const payload = {
      ts: new Date().toISOString(),
      note: "Hello from WebApp!"
    };

    console.log("Sending:", payload);

    // Send to bot
    tg.sendData(JSON.stringify(payload));
  });

  // Optional: log Telegram context
  console.log("WebApp initialized:", {
    user: tg.initDataUnsafe.user,
    chat: tg.initDataUnsafe.chat
  });
</script>

</body>
</html>
